[env:esp32dev]
; Versioni bloccate: con "espressif32" senza versione PlatformIO ora installa
; la 8.x (Arduino core 3.x) e il progetto non compila più (ledcSetup, WiFi).
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    -Wno-deprecated-declarations
    -D ARDUINO_LOOP_STACK_SIZE=16384
monitor_speed = 115200
lib_deps =
    adafruit/RTClib @ ^2.1.3
    adafruit/Adafruit BME280 Library @ ^2.2.4
    zinggjm/GxEPD2 @ 1.6.9
    earlephilhower/ESP8266Audio @ ^1.9.7
    https://github.com/pschatzmann/ESP32-A2DP.git#89f3842
test_ignore = *

; Test di non regressione su PC: pio test -e native
; I test includono direttamente i sorgenti di lib/ e usano i finti in test/mocks.
[env:native]
platform = native
test_framework = unity
test_build_src = no
; Le librerie di lib/ non si compilano da sole: i test includono i .cpp che servono
lib_ignore = alarm, audio, display, fonts, input, led, logic, menu, network, power, presence, sensors, state, ui, watchdog
build_flags =
    -std=gnu++17
    -I test/mocks
    -I include
    -Wall
